services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${HONO_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOSTED_API_ENVIRONMENT: local
      HOSTED_DR_LOCAL_FAULT_INJECTION: "true"
      HONO_HOST: 0.0.0.0
      HONO_PORT: 8787
      HONO_CORS_ORIGINS: ${HONO_CORS_ORIGINS:?请配置 HONO_CORS_ORIGINS}
      HONO_AUTH_MODE: bearer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
      REDIS_REQUIRED: "true"
      D1_REQUIRED: "true"
      D1_GATEWAY_URL: ${D1_GATEWAY_URL:?请配置 D1_GATEWAY_URL}
      D1_GATEWAY_HMAC_SECRET: ${D1_GATEWAY_HMAC_SECRET:?请配置 D1_GATEWAY_HMAC_SECRET}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDERS_CONFIG: ${AI_PROVIDERS_CONFIG:-}
      SIGNATURE_SECRET_KEY: ${SIGNATURE_SECRET_KEY:?请配置 SIGNATURE_SECRET_KEY}
      ARENA_FINALIZATION_URL: ${ARENA_FINALIZATION_URL:?请配置 ARENA_FINALIZATION_URL}
      ARENA_FINALIZATION_HMAC_SECRET: ${ARENA_FINALIZATION_HMAC_SECRET:?请配置 ARENA_FINALIZATION_HMAC_SECRET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?请配置 R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?请配置 R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?请配置 R2_BUCKET_NAME}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?请配置 R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "25"

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}"]
    volumes:
      - hono-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}

volumes:
  hono-redis-data:
