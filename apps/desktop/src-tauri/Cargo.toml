[package]
name = "mahoshojo-desktop"
version = "0.0.0"
description = "MahoShojo Generator 本地桌面客户端"
edition = "2021"
rust-version = "1.90"
publish = false

# 只构建桌面二进制。V1 明确不覆盖移动端，因此不引入 staticlib/cdylib，
# 避免为未进入范围的目标付出构建与签名成本。
[lib]
name = "mahoshojo_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "4", features = [
  "windows-native-keyring-store",
  "apple-native-keyring-store",
  "zbus-secret-service-keyring-store",
  "linux-keyutils-keyring-store",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# raw_value 让本地卡 document 的自由载荷以原始文本保留，而不是实例化成 String。
# 没有它，serde_json 会拒绝 JavaScript 可产出的孤立代理项转义（\ud800），
# 从而在桌面端静默拒收 Web 已有的合法数据。依据 SPEC-desktop-client-v1 DESK-062。
serde_json = { version = "1", features = ["raw_value"] }
# 内容寻址 blob 的摘要计算。MIT / Apache-2.0，纯 Rust。
sha2 = "0.10"
# 同目录唯一命名的临时文件，用于"临时文件 -> sync -> 原子 rename"的写入顺序。
# 放在 blob 目录内是硬性要求：rename 只在同一文件系统内原子。
tempfile = "3"
tauri = { version = "2", features = [] }
# RFC3339 解析，用于把本地卡 updatedAt 规范化成 UTC epoch 毫秒的 keyset 排序键。
# 不自己写日期解析：闰年、世纪闰年、offset 边界这类错误极难靠肉眼保证，而排序键算错会
# 直接表现为 keyset 漏读。MIT / Apache-2.0，纯 Rust。
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[profile.dev]
incremental = true
