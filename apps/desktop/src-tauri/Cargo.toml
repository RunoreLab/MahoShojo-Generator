[package]
name = "mahoshojo-desktop"
version = "0.1.0"
description = "MahoShojo Generator 本地桌面客户端"
edition = "2021"
rust-version = "1.90"
publish = false

# 只构建桌面二进制。V1 明确不覆盖移动端，因此不引入 staticlib/cdylib，
# 避免为未进入范围的目标付出构建与签名成本。
[lib]
name = "mahoshojo_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 标准 base64 编解码。MIT / Apache-2.0，纯 Rust，无额外传递依赖。
# 自己手写解码器的问题不是"风格"：宽松的 padding 处理会静默接受截断载荷，
# 而逐字符线性查表在 64 MiB 归档上是 10^9 量级的比较。依据 DESK-064。
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
keyring = { version = "4", features = [
  "windows-native-keyring-store",
  "apple-native-keyring-store",
  "zbus-secret-service-keyring-store",
  "linux-keyutils-keyring-store",
] }
log = { version = "0.4.34", default-features = false, features = ["max_level_info", "release_max_level_info"] }
# Web Package 资源路径的 percent 编码/解码（D4b）。MIT / Apache-2.0，纯 Rust，
# 已是 url crate 的传递依赖——升级为直接依赖是为了 `AsciiSet::remove` 精确镜像
# encodeURIComponent 的 unreserved 集，而不是引入新的供应链面。
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
# raw_value 让本地卡 document 的自由载荷以原始文本保留，而不是实例化成 String。
# 没有它，serde_json 会拒绝 JavaScript 可产出的孤立代理项转义（\ud800），
# 从而在桌面端静默拒收 Web 已有的合法数据。依据 SPEC-desktop-client-v1 DESK-062。
serde_json = { version = "1", features = ["raw_value"] }
# 内容寻址 blob 的摘要计算。MIT / Apache-2.0，纯 Rust。
sha2 = "0.10"
# 跨进程 advisory 文件锁。MIT / Apache-2.0，纯 Rust（以 rustix 取代 libc）。
# V1 单实例的机制选择：按**数据目录**加锁，而不是 tauri-plugin-single-instance
# 按 app id 加锁——dev 构建与另一个构建可以有不同 app id 却共享同一个数据目录，
# 而那正是 DESK-065 要防的情况（依据 SPEC-desktop-client-v1 DESK-065 / DESK-068）。
fs4 = "1.1.0"
# 同目录唯一命名的临时文件，用于"临时文件 -> sync -> 原子 rename"的写入顺序。
# 放在 blob 目录内是硬性要求：rename 只在同一文件系统内原子。
tempfile = "3"
# 最低版本约束覆盖 GHSA-w28w-mhc8-qvjv：<=2.11.5 的 Channel 取回使用全应用共享的
# 可预测 ID，未获 capability 的 webview 可猜 ID 窃取可信 webview 的 Channel 数据
# （ADR-desktop-tauri-v1 §2）。
tauri = { version = "2.11.6", features = [] }
# Official signed updater, MIT/Apache-2.0. Rust-only API; no plugin IPC grant.
# v2 NSIS uses the installer directly, so legacy v1 archive support is unnecessary.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# RFC3339 解析，用于把本地卡 updatedAt 规范化成 UTC epoch 毫秒的 keyset 排序键。
# 不自己写日期解析：闰年、世纪闰年、offset 边界这类错误极难靠肉眼保证，而排序键算错会
# 直接表现为 keyset 漏读。MIT / Apache-2.0，纯 Rust。
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
url = "2"
http-range = "0.1.5"
# IMG-ASSET-001: MIT/Apache-2.0 pure Rust; only supported static raster decoders.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
open = "5"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# Wry 0.57 already locks this MIT crate. Direct access installs the native page-close
# callback before any untrusted document loads; no plugin or additional dependency tree.
webview2-com = "=0.39.1"
# Already locked, MIT/Apache-2.0. LOCAL-2 uses narrow native trust, process/job and
# listener ownership APIs; no shell plugin or runtime installation dependency.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.dev]
incremental = true

[dev-dependencies]
# The test feature only exposes Tauri's in-process IPC harness; no new dependency.
tauri = { version = "2.11.6", features = ["test"] }
# test-util 提供 time::advance / #[tokio::test(start_paused)]，仅限测试构建。
tokio = { version = "1", features = ["test-util"] }
