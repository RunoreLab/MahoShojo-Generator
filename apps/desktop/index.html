<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MahoShojo Generator</title>
    <!--
      共源亮暗偏好的首屏前初始化（D5.0d）。这段脚本与 Web `layout.tsx` 注入的是
      同一份生成产物——`getColorModeInitScript()`（@mahoshojo/ui-web/color-mode-init）；
      tests/color-mode-init.test.ts 断言两者逐字相等，改脚本必须先改共享源。
    -->
    <script>
(() => {
  try {
    var stored = window.localStorage.getItem("mahoshojo.color-mode");
    var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
    document.documentElement.dataset.colorMode = resolved;
  } catch (e) {}
})();
    </script>
    <!--
      减少动效偏好的首屏前初始化（D5.1-S1）：与 Web `layout.tsx` 注入的是
      同一份生成产物——`getMotionPreferenceInitScript()`
      （@mahoshojo/ui-web/device-preferences-init）；tests/motion-init.test.ts
      断言两者逐字相等。`data-motion` 是解析后的生效状态，共享 CSS 与
      动画 hook 只认这一个根标记。
    -->
    <script>
(() => {
  var media;
  try {
    media = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  } catch (e) {
    media = undefined;
  }
  var apply = function () {
    var preference = 'system';
    try {
      var stored = window.localStorage.getItem("mahoshojo.motion-preference");
      if (stored === 'reduce' || stored === 'system') {
        preference = stored;
      }
    } catch (e) {}
    var resolved = preference === 'reduce' || (media && media.matches) ? 'reduce' : 'no-preference';
    try {
      document.documentElement.dataset.motion = resolved;
    } catch (e) {}
  };
  apply();
  try {
    if (media && media.addEventListener) {
      media.addEventListener('change', apply);
    } else if (media && media.addListener) {
      media.addListener(apply);
    }
  } catch (e) {}
})();
    </script>
    <!-- 阅读偏好的共源首屏初始化；与 device-preferences-init 逐字一致。 -->
    <script>
(() => {
  var key = "mahoshojo.reading-preferences.v1";
  var sizes = [100,110,125,150,175,200];
  var apply = function () {
    var value = {};
    try {
      var parsed = JSON.parse(window.localStorage.getItem(key));
      if (parsed && !Array.isArray(parsed) && parsed.version === 1) value = parsed;
    } catch (e) {}
    try {
      var data = document.documentElement.dataset;
      data.readingSize = String(sizes.indexOf(value.sizePercent) >= 0 ? value.sizePercent : 100);
      data.readingFont = value.font === 'sans' || value.font === 'serif' ? value.font : 'default';
      data.readingLineHeight = value.lineHeight === 'comfortable' || value.lineHeight === 'relaxed' ? value.lineHeight : 'default';
      data.readingWidth = value.width === 'narrow' ? 'narrow' : 'default';
    } catch (e) {}
  };
  apply();
  window.addEventListener('storage', function (event) {
    if (event.key === key || event.key === null) apply();
  });
})();
    </script>
    <!--
      品牌首帧（D5.2）：WebView 解析完 HTML 到 React 首次 commit 之间 #root 是空的，
      先内联一份极轻的品牌画面盖住这段窗口——React createRoot 渲染时自然接管并
      清空这些节点，不需要额外状态机/计时器。配色镜像 `--app-magic-bg-white` 的
      亮/暗两个值（此刻共享样式表尚未加载，只能写字面量，两侧改动须同步）；
      亮暗由上面 init 脚本写入的 `data-color-mode` 选择。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .desktop-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffffff 0%, #ffffff 25%, #ffe3f6 86%, #fecfef 100%);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      html[data-color-mode='dark'] .desktop-boot {
        background: linear-gradient(155deg, #0b1220 0%, #0b1220 42%, #241827 68%, #6f294d 88%, #d8578b 100%);
      }
      .desktop-boot-logo {
        width: min(220px, 72vw);
        aspect-ratio: 1478 / 981;
        background-image: url('/logo.svg');
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        filter: drop-shadow(0 10px 32px rgba(216, 87, 139, 0.28));
        animation: desktop-boot-pulse 1.6s ease-in-out infinite;
      }
      html[data-color-mode='dark'] .desktop-boot-logo {
        background-image: url('/logo-white.svg');
      }
      @keyframes desktop-boot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(0.97);
        }
      }
      /* 系统级减少动效安全网：init 脚本未跑/失败时也要兜住（D5.1-S1-r1）。 */
      @media (prefers-reduced-motion: reduce) {
        .desktop-boot-logo {
          animation: none;
        }
      }
      html[data-motion='reduce'] .desktop-boot-logo {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="desktop-boot" aria-hidden="true">
        <div class="desktop-boot-logo"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
