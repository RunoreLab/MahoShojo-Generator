name = "ifmahoushoujo"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 绑定配置（Better Auth / Drizzle 运行时依赖）
# 请在部署前替换下列 database_id 占位值。
[[d1_databases]]
binding = "DB"
database_name = "ifmahoushoujo"
database_id = "replace_with_production_d1_database_id"
preview_database_id = "replace_with_preview_d1_database_id"
migrations_dir = "drizzle"

[env.production]
name = "ifmahoushoujo"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "ifmahoushoujo"
database_id = "replace_with_production_d1_database_id"
preview_database_id = "replace_with_preview_d1_database_id"
migrations_dir = "drizzle"

[env.preview]
name = "ifmahoushoujo-preview"
compatibility_date = "2024-09-23" 
compatibility_flags = ["nodejs_compat"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ifmahoushoujo-preview"
database_id = "replace_with_preview_d1_database_id"
preview_database_id = "replace_with_preview_d1_database_id"
migrations_dir = "drizzle"
