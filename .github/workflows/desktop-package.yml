name: Desktop Package

# 内部安装包流水线（D5.2-A）：在 Windows runner 上产出 NSIS 安装包，
# 供跨设备安装验收使用。
# - 不获取发布私钥、不做 OS 代码签名、不生成 updater 产物、不创建 GitHub Release；
#   正式发布由后续独立的受保护 release workflow 负责（ADR-client-runtime-release §5）。
# - 仅手动触发：Windows release 构建成本高，不随推送自动运行；
#   需要安装包时在 Actions 页面手动运行本 workflow。日常验证仍由
#   desktop-ci.yml 承担，本 workflow 只回答"这份代码能否产出安装包"。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-nsis:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop version consistency
        run: pnpm run check:desktop-version

      - name: Build desktop app and NSIS bundle
        shell: pwsh
        run: |
          # 内部测试不申请发布密钥；仅覆盖产物签名开关，不修改客户端的公钥与更新端点。
          $internalConfig = Join-Path $env:RUNNER_TEMP 'desktop-internal-bundle.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $internalConfig -Encoding utf8NoBOM
          pnpm --filter @mahoshojo/desktop exec tauri build --config "$internalConfig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          Get-ChildItem $bundle -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 (Join-Path $bundle 'SHA256SUMS.txt')
          Get-Content (Join-Path $bundle 'SHA256SUMS.txt')

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahoshojo-desktop-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
