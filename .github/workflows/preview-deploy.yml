name: Deploy preview

on:
  push:
    branches:
      - preview
  workflow_dispatch:
    inputs:
      arena_multiplayer:
        description: 仅控制 Cloudflare Web exposure；Hono runtime 由服务器 ARENA_MULTIPLAYER_ENABLED 控制
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled

concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREVIEW_ARENA_MULTIPLAYER_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.arena_multiplayer == 'disabled' && 'false' || 'true' }}
  PREVIEW_ARENA_ROOM_ALLOWED_ORIGINS: https://mahoshojo.colanns.me,https://maho-preview.colanns.me,https://mahoshojo-next-preview.719147538.workers.dev

# Preview 发布假定合并前已在本地或集成 CI 执行 `pnpm run ci:verify`；这里仅保留
# 构建、发布与公网契约 canary，避免在每次 Preview 部署中重复执行耗时的整仓门禁。
jobs:
  verify-and-build-hono:
    name: Build Hono preview
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release tuple
        run: |
          pnpm --filter @mahoshojo/api run deploy:prepare
          cp apps/api/deploy/compose.yml apps/api/dist/compose.yml
          cp apps/api/deploy/deploy-bundle.sh apps/api/dist/deploy-bundle.sh
          cd apps/api/dist
          sha256sum index.mjs compose.yml deploy-bundle.sh > release.manifest
          sha256sum release.manifest > release.sha256

      - name: Upload release tuple
        uses: actions/upload-artifact@v4
        with:
          name: hono-preview-${{ github.sha }}
          path: |
            apps/api/dist/index.mjs
            apps/api/dist/compose.yml
            apps/api/dist/deploy-bundle.sh
            apps/api/dist/release.manifest
            apps/api/dist/release.sha256
          if-no-files-found: error
          retention-days: 7

  verify-and-build-cloudflare:
    name: Build Cloudflare preview
    if: github.ref == 'refs/heads/preview'
    needs: verify-and-build-hono
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare preview bundle
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL: ${{ vars.NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL }}
          NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK: ${{ vars.NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SAFETY_CHECK_POLICY: ${{ vars.NEXT_PUBLIC_SAFETY_CHECK_POLICY }}
          NEXT_PUBLIC_HOSTED_API_ENVIRONMENT: preview
          NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED: ${{ env.PREVIEW_ARENA_MULTIPLAYER_ENABLED }}
        run: |
          set -euo pipefail
          NEXT_PUBLIC_HONO_API_ORIGIN="$(node -p "require('./config/hosted-routing.json').origins.preview")"
          export NEXT_PUBLIC_HONO_API_ORIGIN
          pnpm --filter @mahoshojo/web run build:cf

  deploy-hono-preview:
    name: Deploy Hono preview
    if: github.ref == 'refs/heads/preview'
    needs:
      - verify-and-build-hono
      - verify-and-build-cloudflare
    runs-on: ubuntu-latest
    environment: hono-preview
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      HONO_DEPLOY_ROOT_DIR: ${{ vars.HONO_DEPLOY_ROOT }}
      HONO_CONTAINER_NAME: mahoshojo-hono-preview
      HONO_BIND_PORT: ${{ vars.HONO_BIND_PORT }}
      HONO_PUBLIC_ORIGIN: ${{ vars.HONO_PUBLIC_ORIGIN }}
      HONO_REDIS_KEY_PREFIX: preview
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Download release tuple
        uses: actions/download-artifact@v5
        with:
          name: hono-preview-${{ github.sha }}
          path: artifact

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$HONO_DEPLOY_ROOT_DIR"
          test -n "$HONO_BIND_PORT"
          test -n "$HONO_PUBLIC_ORIGIN"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$VPS_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIARFAFVUCsUdVM8PtbbiOhkUD9zn5Q6MeK47hxEr/XuC' > ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          set -euo pipefail
          release_id="$(awk '{print $1}' artifact/release.sha256)"
          case "$release_id" in
            ''|*[!0-9a-f]*) echo "artifact release id 非法" >&2; exit 1 ;;
          esac
          test "${#release_id}" -eq 64
          case "$HONO_DEPLOY_ROOT_DIR" in
            /opt/mahoshojo-hono-preview) ;;
            *) echo "Preview 部署根目录非法" >&2; exit 1 ;;
          esac
          release_dir="$HONO_DEPLOY_ROOT_DIR/releases/$release_id"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "test -d '$HONO_DEPLOY_ROOT_DIR/releases' && test ! -L '$HONO_DEPLOY_ROOT_DIR/releases' && if test -e '$release_dir' || test -L '$release_dir'; then test -d '$release_dir' && test ! -L '$release_dir'; else mkdir -- '$release_dir'; fi"
          scp -i ~/.ssh/deploy_key \
            artifact/index.mjs \
            artifact/compose.yml \
            artifact/deploy-bundle.sh \
            artifact/release.manifest \
            artifact/release.sha256 \
            "$VPS_USER@$VPS_HOST:$release_dir/"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "chmod 755 '$release_dir/deploy-bundle.sh' && HONO_DEPLOY_ROOT_DIR='$HONO_DEPLOY_ROOT_DIR' HONO_CONTAINER_NAME='$HONO_CONTAINER_NAME' HONO_BIND_PORT='$HONO_BIND_PORT' HONO_REDIS_KEY_PREFIX='$HONO_REDIS_KEY_PREFIX' HONO_HOSTED_API_ENVIRONMENT=preview '$release_dir/deploy-bundle.sh' publish '$release_id' '$HONO_PUBLIC_ORIGIN'"

  deploy-cloudflare-preview:
    name: Deploy Cloudflare preview
    if: github.ref == 'refs/heads/preview'
    needs:
      - deploy-hono-preview
      - verify-and-build-cloudflare
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare preview bundle
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL: ${{ vars.NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL }}
          NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK: ${{ vars.NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SAFETY_CHECK_POLICY: ${{ vars.NEXT_PUBLIC_SAFETY_CHECK_POLICY }}
          NEXT_PUBLIC_HOSTED_API_ENVIRONMENT: preview
          NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED: ${{ env.PREVIEW_ARENA_MULTIPLAYER_ENABLED }}
        run: |
          set -euo pipefail
          NEXT_PUBLIC_HONO_API_ORIGIN="$(node -p "require('./config/hosted-routing.json').origins.preview")"
          export NEXT_PUBLIC_HONO_API_ORIGIN
          pnpm --filter @mahoshojo/web run build:cf

      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @mahoshojo/web exec wrangler deploy --env preview --keep-vars

      - name: Verify preview Hono remains ready
        run: curl --fail --show-error --retry 6 --retry-delay 5 https://homura-preview.colanns.me/api/health/ready
