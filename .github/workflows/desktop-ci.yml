name: Desktop CI

# Rust 门禁与仓库主 CI 分开：
# - apps/desktop 的 workspace build 只做前端产物，因此 pnpm workspace:build 不需要 Rust；
# - Rust 编译需要工具链与平台系统依赖，塞进主 CI 会让所有 app 的验证被桌面构建绑架。
# 建议把本 workflow 的 verify-rust job 配为分支保护的 required check，
# 以免 ci:verify 与 Rust 之间出现无门禁窗口。

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches:
      - refactor/platform-rearchitecture
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rust:
    name: Verify desktop Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop frontend
        run: pnpm --filter @mahoshojo/desktop run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
