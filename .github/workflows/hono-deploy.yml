name: Deploy Hono

on:
  push:
    branches:
      - feature/v0.2.0_Battle_Growth_MahoShojo
  workflow_dispatch:
    inputs:
      arena_multiplayer:
        description: 仅控制 Cloudflare Web exposure；Hono runtime 由服务器 ARENA_MULTIPLAYER_ENABLED 控制
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      skip_build: true

  build-web:
    uses: ./.github/workflows/cloudflare-build.yml
    with:
      arena_multiplayer_enabled: ${{ github.event_name == 'push' || inputs.arena_multiplayer == 'enabled' }}
    secrets: inherit

  build:
    concurrency:
      group: hono-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      release_id: ${{ steps.release.outputs.release_id }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Hono
        run: pnpm --filter @mahoshojo/api run build

      - name: Verify Hono container build
        env:
          HONO_RELEASE_DIR: /tmp/mahoshojo-hono-release
          HONO_HOSTED_API_ENVIRONMENT: production
          HONO_DEPLOY_CORS_ORIGINS: https://mahoshojo.colanns.me
          COMPOSE_ENV_DIRECTORY: /opt/mahoshojo-hono
          COMPOSE_ENV_FILE: /opt/mahoshojo-hono/.env.hono
        run: |
          set -euo pipefail
          cleanup_compose_environment() {
            sudo rm -f -- "$COMPOSE_ENV_FILE"
            sudo rmdir -- "$COMPOSE_ENV_DIRECTORY"
          }
          sudo test ! -e "$COMPOSE_ENV_DIRECTORY"
          sudo test ! -L "$COMPOSE_ENV_DIRECTORY"
          sudo mkdir -m 700 -- "$COMPOSE_ENV_DIRECTORY"
          trap cleanup_compose_environment EXIT
          sudo install -m 600 /dev/null "$COMPOSE_ENV_FILE"
          docker build --file apps/api/Dockerfile .
          sudo --preserve-env=HONO_RELEASE_DIR,HONO_HOSTED_API_ENVIRONMENT,HONO_DEPLOY_CORS_ORIGINS docker compose -f apps/api/deploy/compose.yml config --no-env-resolution

      - name: Build single-file server
        id: release
        run: |
          pnpm --filter @mahoshojo/api run deploy:prepare
          cp apps/api/deploy/compose.yml apps/api/dist/compose.yml
          cp apps/api/deploy/deploy-bundle.sh apps/api/dist/deploy-bundle.sh
          cd apps/api/dist
          sha256sum index.mjs compose.yml deploy-bundle.sh > release.manifest
          sha256sum release.manifest > release.sha256
          echo "release_id=$(cut -d ' ' -f 1 release.sha256)" >> "$GITHUB_OUTPUT"

      - name: Verify Hono built runtime integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
          D1_GATEWAY_URL: http://127.0.0.1:8788
          HOSTED_API_ENVIRONMENT: local
          HOSTED_DR_LOCAL_FAULT_INJECTION: 'true'
          ROOM_REDIS_VERIFY: 'true'
          ROOM_REDIS_VERIFY_KEY_PREFIX: gmr10p_ci
          ROOM_GENERATION_REDIS_VERIFY: 'true'
          ROOM_GENERATION_REDIS_VERIFY_KEY_PREFIX: gmr10p_generation_ci
          ROOM_GENERATION_PROCESS_VERIFY: 'true'
          ROOM_GENERATION_PROCESS_VERIFY_TOKEN: gmr10p-ci-process
          D1_GATEWAY_HMAC_SECRET: g25c-ci-only-d1-gateway-hmac-secret
          HONO_AUTH_MODE: bearer
          HONO_CORS_ORIGINS: https://g25c-ci.example.invalid
          AI_API_KEY: g25c-ci-only-provider-placeholder
          SIGNATURE_SECRET_KEY: g25c-ci-only-signature-secret-value
          ARENA_FINALIZATION_URL: https://g25r-ci.example.invalid
          ARENA_FINALIZATION_HMAC_SECRET: g25r-ci-only-independent-finalization-secret
          R2_ACCESS_KEY_ID: g25r-ci-only-r2-access-key
          R2_SECRET_ACCESS_KEY: g25r-ci-only-r2-secret-key
          R2_BUCKET_NAME: g25r-ci-only-r2-bucket
          R2_ACCOUNT_ID: g25r-ci-only-r2-account
        run: |
          set -euo pipefail
          gateway_log="$RUNNER_TEMP/d1-gateway.log"
          pnpm --filter @mahoshojo/d1-gateway exec wrangler dev --local \
            --ip 127.0.0.1 \
            --port 8788 \
            --persist-to "$RUNNER_TEMP/d1-gateway-state" \
            --var "D1_GATEWAY_HMAC_SECRET:$D1_GATEWAY_HMAC_SECRET" \
            --show-interactive-dev-session false \
            >"$gateway_log" 2>&1 &
          gateway_pid=$!
          cleanup() {
            kill "$gateway_pid" 2>/dev/null || true
            wait "$gateway_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          gateway_ready=false
          for _ in {1..100}; do
            if curl --fail --silent --show-error "$D1_GATEWAY_URL/health" >/dev/null; then
              gateway_ready=true
              break
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if [ "$gateway_ready" != true ]; then
            cat "$gateway_log" >&2
            exit 1
          fi

          pnpm --filter @mahoshojo/api run verify:arena-redis
          pnpm --filter @mahoshojo/api run verify:room-redis
          pnpm --filter @mahoshojo/api run verify:room-generation-redis
          pnpm --filter @mahoshojo/api run verify:room-generation-process-recovery
          pnpm run verify:server:runtime

      - name: Upload bundle
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: hono-server-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/api/dist/index.mjs
            apps/api/dist/compose.yml
            apps/api/dist/deploy-bundle.sh
            apps/api/dist/release.manifest
            apps/api/dist/release.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify, build, build-web]
    if: github.ref == 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo'
    # The lock covers every job in the called workflow, including Web deployment.
    concurrency:
      group: hono-production
      cancel-in-progress: false
    uses: ./.github/workflows/production-release.yml
    with:
      hono_artifact_id: ${{ needs.build.outputs.artifact_id }}
      hono_artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      hono_release_id: ${{ needs.build.outputs.release_id }}
      web_artifact_id: ${{ needs.build-web.outputs.artifact_id }}
      web_bundle_sha256: ${{ needs.build-web.outputs.bundle_sha256 }}
    secrets: inherit
