name: Repository CI

on:
  pull_request:
  push:
    branches:
      - refactor/platform-rearchitecture
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_build:
        description: 发布流水线由并行的应用构建 job 提供构建与类型检查
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    concurrency:
      group: repository-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        if: ${{ !inputs.skip_build }}
        run: pnpm run ci:verify

      - name: Verify repository without duplicate builds
        if: ${{ inputs.skip_build }}
        run: pnpm run ci:verify:checks
