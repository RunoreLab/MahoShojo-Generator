# 生产分支约束：
# 本工作流只允许通过 GitHub Actions 触发本地脚本写入统计快照，
# 不得在生产分支额外提供任何线上 admin 页面或 admin API 入口。
name: User Analytics Daily Snapshot

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅采集不写入 admin_user_analytics_daily'
        required: false
        type: boolean
        default: false
      backfill_days:
        description: '检查最近 N 天缺失快照，生产分支不补写历史日'
        required: false
        type: string
        default: '7'
      skip_current:
        description: '仅检查缺失快照，不记录本次即时快照'
        required: false
        type: boolean
        default: false

concurrency:
  group: user-analytics-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Capture Daily Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Required Secrets
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${D1_DATABASE_ID:?missing D1_DATABASE_ID secret}"

      - name: Record User Analytics Snapshot
        run: |
          set -euo pipefail

          backfill_days="7"
          dry_run="false"
          skip_current="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            backfill_days="${{ inputs.backfill_days }}"
            dry_run="${{ inputs.dry_run }}"
            skip_current="${{ inputs.skip_current }}"
          fi

          if [ -z "${backfill_days}" ]; then
            backfill_days="7"
          fi

          args=("--backfill-days" "${backfill_days}")

          if [ "${dry_run}" = "true" ]; then
            args+=("--dry-run")
          fi

          if [ "${skip_current}" = "true" ]; then
            args+=("--skip-current")
          fi

          bun scripts/snapshot-admin-user-analytics-daily.ts "${args[@]}"
