name: Deploy Cloudflare production

on:
  workflow_dispatch:
    inputs:
      confirm_disable_multiplayer:
        description: Emergency Web-only rollback；this workflow can only disable multiplayer
        required: true
        type: choice
        options:
          - disable

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  build:
    if: github.ref == 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo' && inputs.confirm_disable_multiplayer == 'disable'
    uses: ./.github/workflows/cloudflare-build.yml
    with:
      arena_multiplayer_enabled: false
    secrets: inherit

  release:
    needs: build
    concurrency:
      group: hono-production
      cancel-in-progress: false
    uses: ./.github/workflows/production-release.yml
    with:
      web_only: true
      web_artifact_id: ${{ needs.build.outputs.artifact_id }}
      web_bundle_sha256: ${{ needs.build.outputs.bundle_sha256 }}
    secrets: inherit
