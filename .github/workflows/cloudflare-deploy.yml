name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo' && 'production' || 'preview' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare bundle
        run: pnpm run build:cf

      - name: Deploy production
        if: github.ref == 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview
        if: github.ref != 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
