name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - feature/v0.2.0_Battle_Growth_MahoShojo
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/feature/v0.2.0_Battle_Growth_MahoShojo'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace and repository gates
        run: pnpm run ci:verify

      - name: Verify Arena Room backend activation
        env:
          NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED: ${{ vars.NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED }}
          NEXT_PUBLIC_ARENA_ROOM_WRITER_ACTIVATION: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_WRITER_ACTIVATION }}
          NEXT_PUBLIC_ARENA_ROOM_READER_CONTRACT: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_READER_CONTRACT }}
          NEXT_PUBLIC_ARENA_ROOM_GO_NO_GO: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_GO_NO_GO }}
        run: |
          set -euo pipefail
          room_web_enabled=false
          case "${NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED,,}" in
            ''|0|false|no|off) ;;
            1|true|yes|on) room_web_enabled=true ;;
            *) echo 'NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED 非法' >&2; exit 1 ;;
          esac
          if [ "$room_web_enabled" = true ]; then
            test "$NEXT_PUBLIC_ARENA_ROOM_WRITER_ACTIVATION" = enabled
            test "$NEXT_PUBLIC_ARENA_ROOM_READER_CONTRACT" = arena-room-authority-v2-generation-payload-digest-v1
            test "$NEXT_PUBLIC_ARENA_ROOM_GO_NO_GO" = approved
          fi
          room_origin="$(node -p "require('./config/hosted-dr-capabilities.json').controlPlane.primaryOrigin")"
          case "$room_origin" in
            https://*) room_origin="${room_origin%/}" ;;
            *) echo 'Hosted primary origin 必须是 HTTPS origin' >&2; exit 1 ;;
          esac
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "$probe_dir"' EXIT
          status="$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-max-time 120 --retry-connrefused \
            --connect-timeout 5 --max-time 15 \
            --dump-header "$probe_dir/http-headers" \
            --output "$probe_dir/http-body" --write-out '%{http_code}' \
            --header 'Origin: https://mahoshojo.colanns.me' \
            "$room_origin/api/arena/rooms/v1")"
          if [ "$room_web_enabled" = true ]; then
            test "$status" = 401
            grep -Fq '"code":"ROOM_AUTHENTICATION_REQUIRED"' "$probe_dir/http-body"
            tr -d '\r' < "$probe_dir/http-headers" > "$probe_dir/http-headers-normalized"
            test "$(grep -ic '^Access-Control-Allow-Origin:' "$probe_dir/http-headers-normalized")" = 1
            grep -Fixq 'Access-Control-Allow-Origin: https://mahoshojo.colanns.me' "$probe_dir/http-headers-normalized"
          else
            case "$status" in 2??|101) echo 'Room HTTP 在 Web disabled 时意外成功' >&2; exit 1 ;; esac
          fi
          room_websocket_key="$(head -c 16 /dev/urandom | base64)"
          status="$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-max-time 120 --retry-connrefused \
            --connect-timeout 5 --max-time 15 --http1.1 \
            --output "$probe_dir/ws-body" --write-out '%{http_code}' \
            --header 'Origin: https://mahoshojo.colanns.me' \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Version: 13' \
            --header "Sec-WebSocket-Key: $room_websocket_key" \
            --header 'Sec-WebSocket-Protocol: mahoshojo.arena-room.v1' \
            "$room_origin/api/arena/rooms/v1/ws")"
          if [ "$room_web_enabled" = true ]; then
            test "$status" = 401
            grep -Fq '"code":"ROOM_TICKET_REQUIRED"' "$probe_dir/ws-body"
          else
            case "$status" in 2??|101) echo 'Room WSS 在 Web disabled 时意外成功' >&2; exit 1 ;; esac
          fi

      - name: Build Cloudflare bundle
        env:
          # NEXT_PUBLIC_* 变量在构建时被内联进客户端产物，必须在此步骤显式注入。
          # site key 为敏感凭据走 secrets；其余为公开配置走 environment variables。
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL: ${{ vars.NEXT_PUBLIC_AI_SAFETY_PROMPT_LEVEL }}
          NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK: ${{ vars.NEXT_PUBLIC_ENABLE_BUNDLE_SAFETY_CHECK }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SAFETY_CHECK_POLICY: ${{ vars.NEXT_PUBLIC_SAFETY_CHECK_POLICY }}
          NEXT_PUBLIC_HOSTED_API_ENVIRONMENT: production
          NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED: ${{ vars.NEXT_PUBLIC_ARENA_MULTIPLAYER_ENABLED }}
          NEXT_PUBLIC_ARENA_ROOM_WRITER_ACTIVATION: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_WRITER_ACTIVATION }}
          NEXT_PUBLIC_ARENA_ROOM_READER_CONTRACT: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_READER_CONTRACT }}
          NEXT_PUBLIC_ARENA_ROOM_GO_NO_GO: ${{ vars.NEXT_PUBLIC_ARENA_ROOM_GO_NO_GO }}
        run: pnpm --filter @mahoshojo/web run build:cf

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @mahoshojo/web exec wrangler deploy --env production --keep-vars

      - name: Verify production reachability
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --connect-timeout 5 --max-time 15 \
            https://mahoshojo.colanns.me/arena >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --connect-timeout 5 --max-time 15 \
            https://homura.colanns.me/api/health/ready >/dev/null
